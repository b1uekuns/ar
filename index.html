<!DOCTYPE html> 
<html lang="vi"> 
<head> 
  <meta charset="UTF-8" /> 
  <meta name="viewport" 
        content="width=device-width, initial-scale=1.0, 
                 maximum-scale=1.0, user-scalable=no" /> 
  <title>Khối lập phương AR.js với Hiro Marker</title> 
 
  <!-- A-Frame cung cấp hệ thống cảnh 3D --> 
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script> 
 
  <!-- Bản AR.js này hỗ trợ theo dõi marker --> 
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script> 
 
  <style> 
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; } 
    #status { 
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%); 
      z-index: 9999; min-width: 190px; padding: 10px 16px; 
      border-radius: 8px; color: white; 
      background: rgba(183, 28, 28, 0.85); text-align: center; 
      pointer-events: none; 
    } 
    #controls { 
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
      z-index: 9999; display: flex; justify-content: center; 
      flex-wrap: wrap; gap: 8px; width: 92%; 
    } 
    button { 
      padding: 11px 15px; border: none; border-radius: 8px; 
      color: white; background: #1565c0; font-size: 15px; 
      cursor: pointer; touch-action: manipulation; 
    } 
    button:hover { background: #0d47a1; } 
    button:active { transform: scale(0.96); } 
  </style> 
</head> 
<body> 
  <div id="status">Chưa nhận diện được marker</div> 
 
  <div id="controls"> 
    <button id="rotateLeftButton">Xoay trái</button> 
    <button id="rotateRightButton">Xoay phải</button> 
    <button id="growButton">Phóng to</button> 
    <button id="shrinkButton">Thu nhỏ</button> 
    <button id="colorButton">Đổi màu</button> 
    <button id="resetButton">Đặt lại</button> 
  </div>
   <a-scene embedded vr-mode-ui="enabled: false" 
    renderer="antialias: true; alpha: true" 
    arjs="sourceType: webcam; trackingMethod: best; 
          detectionMode: mono; debugUIEnabled: false;"> 
 
    <a-marker id="hiroMarker" type="pattern" url="./patt.hiro" 
      emitevents="true" smooth="true" smooth-count="5" 
      smooth-tolerance="0.01" smooth-threshold="2"> 
 
      <a-box id="cube" position="0 0.5 0" rotation="0 0 0" 
        scale="1 1 1" color="#1565c0" 
        material="opacity: 0.9; transparent: true; 
                  roughness: 0.4; metalness: 0.1;"> 
      </a-box> 
    </a-marker> 
 
    <a-entity camera></a-entity> 
  </a-scene> 
 
  <script> 
    const marker = document.querySelector("#hiroMarker"); 
    const cube = document.querySelector("#cube"); 
    const status = document.querySelector("#status"); 
 
    const rotateLeftButton = document.querySelector("#rotateLeftButton"); 
    const rotateRightButton = document.querySelector("#rotateRightButton"); 
    const growButton = document.querySelector("#growButton"); 
    const shrinkButton = document.querySelector("#shrinkButton"); 
    const colorButton = document.querySelector("#colorButton"); 
    const resetButton = document.querySelector("#resetButton"); 
 
    let rotationY = 0; 
    let cubeScale = 1; 
    let colorIndex = 0; 
    const colors = ["#1565c0", "#e53935", "#43a047", "#fb8c00", "#8e24aa"]; 
 
    marker.addEventListener("markerFound", () => { 
      status.textContent = "Đã nhận diện Hiro Marker"; 
      status.style.background = "rgba(27, 94, 32, 0.85)"; 
      console.log("markerFound"); 
    }); 
 
    marker.addEventListener("markerLost", () => { 
      status.textContent = "Chưa nhận diện được marker"; 
      status.style.background = "rgba(183, 28, 28, 0.85)"; 
      console.log("markerLost"); 
    }); 
 
    rotateLeftButton.addEventListener("click", () => { 
      rotationY -= 45; 
      updateRotation(); 
    }); 
 
    rotateRightButton.addEventListener("click", () => { 
      rotationY += 45; 
      updateRotation(); 
    }); 
 
    growButton.addEventListener("click", () => { 
      cubeScale = Math.min(cubeScale + 0.2, 2.5); 
      updateScale(); 
    }); 
 
    shrinkButton.addEventListener("click", () => { 
      cubeScale = Math.max(cubeScale - 0.2, 0.2); 
      updateScale(); 
    }); 
 
    colorButton.addEventListener("click", () => { 
      colorIndex = (colorIndex + 1) % colors.length; 
      cube.setAttribute("color", colors[colorIndex]); 
    });
        resetButton.addEventListener("click", () => { 
      rotationY = 0; cubeScale = 1; colorIndex = 0; 
      updateRotation(); updateScale(); 
      cube.setAttribute("color", colors[colorIndex]); 
    }); 
 
    function updateRotation() { 
      cube.setAttribute("rotation", `0 ${rotationY} 0`); 
    } 
 
    function updateScale() { 
      cube.setAttribute("scale", `${cubeScale} ${cubeScale} ${cubeScale}`); 
    } 
  </script> 
</body> 
</html>
